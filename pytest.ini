[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
markers =
    slow: test lenti end-to-end (pytest -m "not slow" per saltarli)
    postgres: test di concorrenza, girano solo su Postgres (deploy/test-postgres.sh)
    pdf: generano PDF veri con WeasyPrint (servono Pango e i font: deploy/test-pdf.sh)
env =
    ADDONS_FORCE=todo,contatti,calendario,crm,helpdesk,progetti,timesheet,ai,fiscale,prodotti,vendite,acquisti,magazzino,fatturazione
    LAVORI_SINCRONI=True
