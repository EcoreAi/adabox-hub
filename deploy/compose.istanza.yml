# Un'istanza ospitata: applicazione e database Postgres propri, raggiungibile solo dal proxy sul server (127.0.0.1).
# La gestisce deploy/flotta.py, che passa ENV_ISTANZA, VERSIONE e PORTA.
x-app: &app
  image: adabox_hub_cliente:${VERSIONE:?manca la versione}
  restart: unless-stopped
  env_file: ${ENV_ISTANZA:?manca il file .env dell'istanza}
  volumes:
    - addons:/app/addons
    - backup:/app/backup
    - media:/app/media
    - private:/app/private
    - staticfiles:/app/staticfiles

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${ENV_ISTANZA}
    environment:
      POSTGRES_USER: adabox
      POSTGRES_DB: adabox
    volumes:
      - dati:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adabox -d adabox"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    <<: *app
    depends_on:
      db: {condition: service_healthy}
    environment:
      RELOAD_STRATEGY: gunicorn
      GUNICORN_PIDFILE: /tmp/gunicorn.pid
      LAVORI_SINCRONI: "False"
      ALLEGATI_X_ACCEL: "True"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/salute/', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 180s
  worker:
    <<: *app
    depends_on:
      web: {condition: service_healthy}     # dopo le migrazioni, che le esegue web all'avvio
    environment:
      RELOAD_STRATEGY: none
      LAVORI_SINCRONI: "False"
    command: ["python", "manage.py", "worker"]
  stream:
    <<: *app
    depends_on:
      web: {condition: service_healthy}
    command: ["sh", "-c", "sh deploy/osserva_moduli.sh esci & exec uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --workers 2 --proxy-headers --forwarded-allow-ips '*' --timeout-graceful-shutdown 10"]
    expose:
      - "8001"
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "127.0.0.1:${PORTA:?manca la porta}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - private:/app/private:ro

volumes:
  addons:
  backup:
  dati:
  media:
  private:
  staticfiles:
