# Dietro un proxy HTTPS vale il protocollo che lui dichiara; senza proxy quello di questa connessione.
map $http_x_forwarded_proto $protocollo {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    client_max_body_size 512m;            # il limite vero lo applica l'app (per azienda)

    # nomi dei servizi risolti a ogni richiesta (DNS di Docker): se web o stream vengono ricreati con un IP
    # nuovo, nginx non resta agganciato a quello vecchio (502 fino al suo riavvio)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://web:8000;
    set $stream http://stream:8001;

    # file con l'impronta del contenuto nel nome (admin.2fc99f62e4df.css, core.storage.StaticConImpronta): un
    # contenuto nuovo ha un nome nuovo, quindi il browser può tenerli un anno senza mai chiedere
    location ~ "^/static/(.+\.[0-9a-f]{12}\.[A-Za-z0-9]+)$" {
        alias /app/staticfiles/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /app/media/;
        expires 1d;
    }

    # allegati privati: solo tramite X-Accel-Redirect dalla vista di download (ALLEGATI_X_ACCEL=True)
    location /_privati/ {
        internal;
        alias /app/private/;
    }

    # streaming dell'assistente AI: servizio ASGI dedicato, senza buffer e con connessioni lunghe
    location /ai/flusso/ {
        proxy_pass $stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $protocollo;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # tempo reale delle Comunicazioni: stesso servizio ASGI (senza questa voce si passa alle richieste brevi)
    location /discuss/eventi/ {
        proxy_pass $stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $protocollo;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass $web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $protocollo;
    }
}
