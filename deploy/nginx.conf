server {
    listen 80;
    client_max_body_size 20m;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /app/media/;
        expires 1d;
    }

    # allegati privati: solo tramite X-Accel-Redirect dalla vista di download (ALLEGATI_X_ACCEL=True)
    location /_privati/ {
        internal;
        alias /app/private/;
    }

    # streaming dell'assistente AI: servizio ASGI dedicato, senza buffer e con connessioni lunghe
    location /ai/flusso/ {
        proxy_pass http://stream:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
