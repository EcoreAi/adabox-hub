<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sei offline</title>
<style>body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f5f5f7;color:#1d1d1f;text-align:center;padding:16px}
.c{max-width:360px}h1{font-size:22px;margin:16px 0 8px}p{color:#6e6e73}button{margin-top:16px;padding:12px 20px;border:0;border-radius:10px;background:#1e3a8a;color:#fff;font-size:16px}
#salvate{margin-top:28px}#salvate a{display:block;margin-top:8px;padding:14px 16px;border:1px solid #d2d2d7;border-radius:10px;background:#fff;color:#1e3a8a;font-size:16px;text-decoration:none}</style></head>
<body><div class="c"><img src="/icona-192.png" width="72" height="72" alt=""><h1>Sei offline</h1>
<p>Questa pagina ha bisogno della rete. Quando torna la connessione, riprova.</p>
<button type="button" onclick="location.reload()">Riprova</button>
<div id="salvate" hidden><p>Queste pagine si aprono anche senza rete:</p></div></div>
<script>
/* Le pagine di cui il service worker tiene una copia su questo dispositivo (quelle che i moduli dichiarano apribili
   senza rete, aperte almeno una volta): chi resta senza rete le raggiunge da qui, con il titolo che avevano. */
(function () {
  var riquadro = document.getElementById('salvate'), cache = '{{ cache_pagine }}';
  if (!window.caches) return;
  caches.has(cache).then(function (esiste) { return esiste ? caches.open(cache) : null; }).then(function (c) {
    if (!c) return [];
    return c.keys().then(function (chiavi) {
      return Promise.all(chiavi.map(function (chiave) {
        var percorso = new URL(chiave.url).pathname;
        if (percorso === '/sw-porta-a/') return null;     // non una copia: dove ha portato un indirizzo (vedi sw.js)
        return c.match(chiave).then(function (copia) { return copia.text(); }).then(function (html) {
          var titolo = new DOMParser().parseFromString(html, 'text/html').title.trim();
          return { percorso: percorso, titolo: titolo || percorso };
        });
      }));
    });
  }).then(function (pagine) {
    pagine.forEach(function (p) {
      if (!p) return;
      var a = document.createElement('a');
      a.href = p.percorso; a.textContent = p.titolo;
      riquadro.appendChild(a); riquadro.hidden = false;
    });
  }).catch(function () {});
})();
</script></body></html>
