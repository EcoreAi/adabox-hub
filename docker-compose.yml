# gunicorn non e' pubblicato: lo raggiunge solo nginx sulla rete interna,
# cosi' X-Forwarded-For/Proto li scrive sempre nginx (vedi README, Produzione).
services:
  web:
    build: .
    image: adabox_hub:latest
    container_name: adabox_hub_web
    restart: unless-stopped
    env_file: .env
    environment:
      # installare un modulo dalla pagina Moduli ricarica gunicorn con SIGHUP via pidfile
      RELOAD_STRATEGY: gunicorn
      GUNICORN_PIDFILE: /tmp/gunicorn.pid
      # i lavori (email, promemoria, posta in entrata) li esegue il servizio worker
      LAVORI_SINCRONI: "False"
      ALLEGATI_X_ACCEL: "True"
    volumes:
      - .:/app
      # stato e dati per istanza: restano sull'host anche ricostruendo l'immagine
      - ./addons:/app/addons
      - ./backup:/app/backup
      - ./media:/app/media
      - ./private:/app/private
    expose:
      - "8000"

  # lavori in background e pianificazioni (cron dei manifest); stessa immagine e stessi volumi del web.
  # Quando cambiano i moduli installati esce da solo e restart lo riavvia con il codice nuovo.
  worker:
    image: adabox_hub:latest
    container_name: adabox_hub_worker
    restart: unless-stopped
    depends_on:
      - web
    env_file: .env
    environment:
      LAVORI_SINCRONI: "False"
    command: ["python", "manage.py", "worker"]
    volumes:
      - .:/app
      - ./addons:/app/addons
      - ./backup:/app/backup
      - ./media:/app/media
      - ./private:/app/private

  # streaming dell'assistente AI (Server-Sent Events, /ai/flusso/): ASGI con uvicorn, stessa immagine.
  # gunicorn resta WSGI per tutto il resto (sotto ASGI le viste sincrone di Django andrebbero in fila).
  stream:
    image: adabox_hub:latest
    container_name: adabox_hub_stream
    restart: unless-stopped
    depends_on:
      - web
    env_file: .env
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8001", "--workers", "2",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--timeout-graceful-shutdown", "10"]
    volumes:
      - .:/app
      - ./addons:/app/addons
      - ./private:/app/private
    expose:
      - "8001"

  nginx:
    image: nginx:1.27-alpine
    container_name: adabox_hub_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8096:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - ./private:/app/private:ro
