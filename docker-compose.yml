# gunicorn non e' pubblicato: lo raggiunge solo nginx sulla rete interna,
# cosi' X-Forwarded-For/Proto li scrive sempre nginx (vedi README, Produzione).
services:
  web:
    build: .
    image: adabox_hub:latest
    container_name: adabox_hub_web
    restart: unless-stopped
    env_file: .env
    environment:
      # installare un modulo dalla pagina Moduli ricarica gunicorn con SIGHUP via pidfile
      RELOAD_STRATEGY: gunicorn
      GUNICORN_PIDFILE: /tmp/gunicorn.pid
      # i lavori (email, promemoria, posta in entrata) li esegue il servizio worker
      LAVORI_SINCRONI: "False"
      ALLEGATI_X_ACCEL: "True"
    volumes:
      - .:/app
      # stato e dati per istanza: restano sull'host anche ricostruendo l'immagine
      - ./addons:/app/addons
      - ./backup:/app/backup
      - ./media:/app/media
      - ./private:/app/private
    expose:
      - "8000"

  # lavori in background e pianificazioni (cron dei manifest); stessa immagine e stessi volumi del web.
  # Quando cambiano i moduli installati esce da solo e restart lo riavvia con il codice nuovo.
  worker:
    image: adabox_hub:latest
    container_name: adabox_hub_worker
    restart: unless-stopped
    depends_on:
      - web
    env_file: .env
    environment:
      LAVORI_SINCRONI: "False"
    command: ["python", "manage.py", "worker"]
    volumes:
      - .:/app
      - ./addons:/app/addons
      - ./backup:/app/backup
      - ./media:/app/media
      - ./private:/app/private

  # streaming dell'assistente AI (Server-Sent Events, /ai/flusso/): ASGI con uvicorn, stessa immagine.
  # gunicorn resta WSGI per tutto il resto (sotto ASGI le viste sincrone di Django andrebbero in fila).
  stream:
    image: adabox_hub:latest
    container_name: adabox_hub_stream
    restart: unless-stopped
    depends_on:
      - web
    env_file: .env
    # quando il worker installa un modulo, osserva_moduli esce e restart riparte con il codice nuovo
    command: ["sh", "-c", "sh deploy/osserva_moduli.sh esci & exec uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --workers 2 --proxy-headers --forwarded-allow-ips '*' --timeout-graceful-shutdown 10"]
    volumes:
      - .:/app
      - ./addons:/app/addons
      - ./private:/app/private
    expose:
      - "8001"

  nginx:
    image: nginx:1.27-alpine
    container_name: adabox_hub_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8096:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - ./private:/app/private:ro

  # voce locale, opzionale (profilo "voce"): Speaches con faster-whisper (voce → testo) e Kokoro (testo → voce),
  # API compatibile OpenAI. Senza autenticazione: non è pubblicato, lo raggiungono solo i servizi su questa rete.
  # I modelli stanno in ./volumes/speaches (vedi docs/voce.md). URL da mettere in /impostazioni/: http://adabox_hub_speaches:8000
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: adabox_hub_speaches
    restart: unless-stopped
    profiles: ["voce"]
    volumes:
      - ./volumes/speaches:/home/ubuntu/.cache/huggingface/hub
    environment:
      # nessun download dalla rete mentre gira: i modelli si scaricano a mano (docs/voce.md)
      HF_HUB_OFFLINE: "1"
    expose:
      - "8000"

  # modelli locali con la visione, opzionale (profilo "visione"): Ollama su CPU. Le immagini allegate in chat restano
  # sul server. Non pubblicato. URL del provider (Compatibile OpenAI, locale): http://adabox_hub_ollama:11434/v1
  # Modelli: docker exec adabox_hub_ollama ollama pull qwen3.5:0.8b (vedi docs/visione-locale.md)
  ollama:
    image: ollama/ollama:latest
    container_name: adabox_hub_ollama
    restart: unless-stopped
    profiles: ["visione"]
    volumes:
      - ./volumes/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    expose:
      - "11434"
