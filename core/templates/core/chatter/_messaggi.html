<div class="ui-messaggi">
{% for m in chatter.messaggi %}
  {% include "core/chatter/_messaggio.html" %}
{% empty %}
  <p class="ui-help">Ancora nessun messaggio.</p>
{% endfor %}
{% if chatter.messaggi.has_next %}
  <a class="ui-btn ui-btn-ghost ui-btn-sm" href="{% url 'core:chatter_messaggi' chatter.ct chatter.obj.pk %}?p={{ chatter.messaggi.next_page_number }}"
     hx-get="{% url 'core:chatter_messaggi' chatter.ct chatter.obj.pk %}?p={{ chatter.messaggi.next_page_number }}"
     hx-target="closest .ui-messaggi" hx-swap="beforeend" hx-select=".ui-messaggi > *" onclick="if (window.htmx) this.remove()">Messaggi precedenti</a>
{% endif %}
</div>
