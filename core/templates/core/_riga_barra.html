<li class="ba-riga{% if attiva %} in-barra{% endif %}{% if r.nascosta %} is-nascosta{% endif %}">
  <span class="ba-pos">{% if attiva %}{{ r.posizione|default:"" }}{% endif %}</span><span class="ba-nome">{{ r.nome }}</span>{% if r.colonna %}<span class="ba-nota">{{ r.colonna }}</span>{% endif %}
  <input type="hidden" name="fissa_{{ r.slug }}" value="1"{% if not attiva %} disabled{% endif %}><input type="hidden" name="ordine_{{ r.slug }}" value="{{ r.ordine|default:0 }}"{% if not attiva %} disabled{% endif %}>
  <input type="hidden" name="nascosta_{{ r.slug }}" value="1"{% if not r.nascosta %} disabled{% endif %}>
  <span class="ba-azioni">
    <button type="button" class="ba-occhio" data-ba="occhio" aria-pressed="{{ r.nascosta|yesno:'true,false' }}" title="{% if r.nascosta %}Nascosta: clic per mostrarla{% else %}Visibile: clic per nasconderla{% endif %}" aria-label="Nascondi {{ r.nome }} dal menu"><svg class="ba-si"><use href="#icon-eye"/></svg><svg class="ba-no"><use href="#icon-eye-off"/></svg></button>
    <button type="button" class="ba-sposta" data-ba="su" aria-label="Sposta a sinistra {{ r.nome }}">↑</button><button type="button" class="ba-sposta" data-ba="giu" aria-label="Sposta a destra {{ r.nome }}">↓</button>
    <button type="button" class="ui-btn ui-btn-ghost ui-btn-sm ba-in-altre" data-ba="altre">Metti in «Altre»</button>
    <button type="button" class="ui-btn ui-btn-secondary ui-btn-sm ba-in-barra" data-ba="barra">Porta nella barra</button>
  </span>
</li>
