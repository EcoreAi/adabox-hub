<td class="ut-cella is-{{ cella.livello }}{% if cella.eccezione %} is-eccezione{% endif %}" title="{{ cella.testo }}{% if cella.eccezione %} · eccezione per questa persona{% elif not cella.con_ruolo %} · dedotto dai gruppi{% endif %}">
  {% if u.is_superuser %}<span>Tutto</span>{% else %}<form hx-post="{% url 'core:utente_livello' u.pk %}" hx-trigger="change" hx-target="closest td" hx-swap="outerHTML">{% csrf_token %}<input type="hidden" name="modulo" value="{{ cella.slug }}">
    <select name="livello" class="ut-select" aria-label="Livello di {{ u.username }} in {{ cella.slug }}">{% if cella.con_ruolo %}<option value="ruolo"{% if not cella.eccezione %} selected{% endif %}>Dal ruolo{% if not cella.eccezione %}: {{ cella.testo }}{% endif %}</option>{% endif %}{% for codice, nome in cella.livelli %}<option value="{{ codice }}"{% if cella.eccezione and cella.livello == codice or not cella.con_ruolo and cella.livello == codice %} selected{% endif %}>{{ nome }}</option>{% endfor %}</select></form>{% endif %}
</td>
