{% if aziende|length > 1 %}
<form method="post" action="{% url 'core:cambia_azienda' %}" class="ui-aziende">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <select class="ui-input" name="azienda" aria-label="Azienda corrente" onchange="this.form.submit()">
    {% for a in aziende %}<option value="{{ a.pk }}"{% if a.pk == azienda.pk %} selected{% endif %}>{{ a.nome }}</option>{% endfor %}
  </select>
  <noscript><button type="submit" class="ui-btn ui-btn-secondary ui-btn-sm">Cambia</button></noscript>
</form>
{% endif %}
