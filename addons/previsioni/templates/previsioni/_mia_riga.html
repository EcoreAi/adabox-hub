<tr id="mia-{{ v.origine }}-{{ v.pk }}" data-cerca="{{ v.cerca }}" data-origine="{{ v.origine }}" data-argomento="{{ v.argomento }}" data-tipo="{{ v.tipo }}" data-etichetta="{{ v.etichetta }}">
  <td><a href="{{ v.url }}">{{ v.titolo }}</a></td>
  <td>{{ v.origine_nome }}</td>
  <td>{{ v.argomento }}</td>
  <td>{{ v.tipo_testo }} <small>({{ v.periodo }})</small></td>
  <td>{{ v.creato|date:"d/m/Y" }}</td>
  <td>{% if v.etichetta %}<span class="ui-pill">{{ v.etichetta }}</span>{% else %}—{% endif %}</td>
  <td class="prev-azioni">
    <a class="ui-btn ui-btn-ghost ui-btn-sm" href="{{ v.url }}">Apri</a>
    <details class="prev-azione"><summary class="ui-btn ui-btn-ghost ui-btn-sm">Rinomina</summary>
      <form method="post" action="{{ v.rinomina_url }}" hx-post="{{ v.rinomina_url }}" hx-target="#mia-{{ v.origine }}-{{ v.pk }}" hx-swap="outerHTML">{% csrf_token %}
        <input class="ui-input" type="text" name="titolo" value="{{ v.titolo }}" maxlength="200" required aria-label="Nuovo titolo di {{ v.titolo }}">
        <button type="submit" class="ui-btn ui-btn-primary ui-btn-sm">Salva</button></form></details>
    <details class="prev-azione"><summary class="ui-btn ui-btn-ghost ui-btn-sm">Etichetta</summary>
      <form method="post" action="{{ v.etichetta_url }}" hx-post="{{ v.etichetta_url }}" hx-target="#mia-{{ v.origine }}-{{ v.pk }}" hx-swap="outerHTML">{% csrf_token %}
        <input class="ui-input" type="text" name="etichetta" value="{{ v.etichetta }}" maxlength="60" list="prev-etichette" placeholder="Nessuna" aria-label="Etichetta di {{ v.titolo }}">
        <button type="submit" class="ui-btn ui-btn-primary ui-btn-sm">Salva</button></form></details>
  </td>
</tr>
