<ul class="ai-elenco">
  {% for c in chat %}
  <li><a href="{% url 'ai:conversazione' c.pk %}"{% if conversazione and c.pk == conversazione.pk %} class="is-attiva" aria-current="page"{% endif %}>
    <span class="ai-elenco-titolo">{% if c.preferita %}★ {% endif %}{{ c.titolo }}</span>
    {% if c.progetto_id %}<span class="ai-elenco-progetto"><svg aria-hidden="true"><use href="#ai-cartella"/></svg>{{ c.progetto.nome }}</span>{% endif %}
    <span class="ai-elenco-data">{{ c.aggiornata|date:"d/m H:i" }}</span></a></li>
  {% empty %}
  <li class="ai-vuoto"><p>{{ vuoto }}</p></li>
  {% endfor %}
</ul>
