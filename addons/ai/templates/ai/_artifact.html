{% load ai agganci %}{# Grafico o tabella sotto una risposta: istantanea del momento, con salva, apri e CSV. #}
<figure class="ai-artifact" id="ai-artifact-{{ a.pk }}">
  <figcaption class="ai-artifact-testa">
    <span class="ai-artifact-titolo">{{ a.titolo }}</span>
    {% if a.tipo == "grafico" %}{% with periodo=a.spec|etichetta_periodo filtri=a.spec|etichetta_filtri %}{% if periodo %}<span class="ai-artifact-ora">{{ periodo }}</span>{% endif %}{% if filtri %}<span class="ai-artifact-ora">{{ filtri }}</span>{% endif %}{% endwith %}{% endif %}
    <span class="ai-artifact-ora">dati delle {{ a.aggiornato|default:a.creato|date:"H:i" }} del {{ a.aggiornato|default:a.creato|date:"d/m" }}</span>
    <span class="ai-spazio"></span>
    {% if a.utente_id == request.user.pk %}<form method="post" action="{% url 'ai:aggiorna_artifact' a.pk %}" hx-post="{% url 'ai:aggiorna_artifact' a.pk %}"
          hx-target="#ai-artifact-{{ a.pk }}" hx-swap="outerHTML" hx-disabled-elt="find button">{% csrf_token %}
      <button type="submit" class="ai-azione" data-tip="Aggiorna con i dati di oggi" aria-label="Aggiorna con i dati di oggi"><svg><use href="#icon-refresh"/></svg></button>
    </form>{% endif %}
    <form method="post" action="{% url 'ai:salva_artifact' a.pk %}" hx-post="{% url 'ai:salva_artifact' a.pk %}"
          hx-target="#ai-artifact-{{ a.pk }}" hx-swap="outerHTML">{% csrf_token %}
      <button type="submit" class="ai-azione{% if a.salvato %} is-preferita{% endif %}" aria-pressed="{{ a.salvato|yesno:'true,false' }}"
              data-tip="{% if a.salvato %}Togli dai salvati{% else %}Salva{% endif %}" aria-label="{% if a.salvato %}Togli dai salvati{% else %}Salva{% endif %}"><svg><use href="#ai-stella"/></svg></button>
    </form>
    <a class="ai-azione" href="{% url 'ai:artifact' a.pk %}" data-tip="Apri con i dati di oggi" aria-label="Apri con i dati di oggi"><svg><use href="#ai-artifact"/></svg></a>
    <a class="ai-azione" href="{% url 'ai:artifact_csv' a.pk %}" data-tip="Scarica CSV" aria-label="Scarica CSV"><svg><use href="#icon-download"/></svg></a>
    {% if a.utente_id == request.user.pk %}{% include "ai/_condividi.html" with oggetto=a tipo="artifact" %}{% endif %}
    <button type="button" class="ai-azione" data-salva-documenti="{% url 'ai:salva_documenti' 'artifact' a.pk %}" data-cosa="{% if a.tipo == 'grafico' %}il grafico «{{ a.titolo }}» (PDF con i valori, dati di oggi){% else %}la tabella «{{ a.titolo }}» (CSV, con i dati di oggi){% endif %}" hidden data-tip="Salva nei Documenti" aria-label="Salva nei Documenti"><svg><use href="#ai-cartella"/></svg></button>
    {% agganci "ai.artifact" %}
  </figcaption>
  {% if a.tipo == "grafico" and a.utente_id == request.user.pk %}{% with p=a|periodo_artifact %}{% filtri_artifact a as f %}{% if p or f %}<div class="ui-strumenti-grafico">
    {% if p %}{% include "core/_periodo_grafico.html" %}{% endif %}{% if f %}{% include "core/_filtri_grafico.html" %}{% endif %}</div>{% endif %}{% endwith %}{% endif %}
  {% if a.tipo == "grafico" %}{% with s=a|serie_artifact %}{% if s %}
    {# lo stesso grafico di Analisi: valore al passaggio, clic sul punto → i record (stessa pagina); senza JS l'SVG #}
    <div class="wd-canvas ai-artifact-canvas"><canvas data-grafico="{{ s.dom }}" role="img" aria-label="{{ a.titolo }}"></canvas></div>
    {{ s.dati|json_script:s.dom }}<noscript><div class="ai-artifact-grafico">{{ a|svg_artifact }}</div></noscript>
  {% else %}
    {% with disegno=a|svg_artifact %}{% if disegno %}<div class="ai-artifact-grafico">{{ disegno }}</div>{% else %}<p class="ai-artifact-vuoto">Nessun dato per questo grafico.</p>{% endif %}{% endwith %}
  {% endif %}{% endwith %}
  {% else %}
    {% include "ai/_artifact_tabella.html" with dati=a.dati %}
  {% endif %}
</figure>
