{% if voci %}
<ul class="ai-elenco">
  {% for a in voci %}
  <li><a href="{% url 'ai:artifact' a.pk %}" target="_blank" rel="noopener">
    <span class="ai-elenco-titolo">{{ a.titolo }}</span>
    <span class="ai-elenco-data">{{ a.get_tipo_display }} · {{ a.creato|date:"d/m H:i" }}</span></a></li>
  {% endfor %}
</ul>
{% else %}
<p class="ai-preferiti-vuoto">Salva con la stella un grafico o una tabella sotto una risposta.</p>
{% endif %}
