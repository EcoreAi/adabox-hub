{% if voci %}
<ul class="ai-elenco">
  {% for a in voci %}
  <li><a href="{% url 'ai:artifact' a.pk %}" target="_blank" rel="noopener">
    <span class="ai-elenco-titolo">{{ a.titolo }}</span>
    <span class="ai-elenco-data">{{ a.creato|date:"d/m H:i" }}</span></a></li>
  {% endfor %}
</ul>
{% else %}
<div class="ai-vuoto"><svg><use href="#{{ icona }}"/></svg><p>Nessun elemento salvato.<br>Salvalo con la stella sotto una risposta.</p></div>
{% endif %}
