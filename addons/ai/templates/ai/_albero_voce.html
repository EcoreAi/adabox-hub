<li><a href="{{ v.url }}"{% if chiave == "artifact" %} target="_blank" rel="noopener"{% endif %}{% if v.attiva %} class="is-attiva" aria-current="page"{% endif %} title="{{ v.nome }}{% if v.nota %} · {{ v.nota }}{% endif %}"><span class="ai-elenco-titolo">{{ v.nome }}</span>{% if v.nota %}<span class="ai-albero-nota">{{ v.nota }}</span>{% endif %}</a>
      {% if v.elimina %}<button type="button" class="ai-albero-btn ai-albero-elimina" data-elimina="{{ v.elimina }}" data-conferma="{{ v.conferma }}"{% if v.attiva %} data-corrente{% endif %} aria-label="Elimina {{ v.nome }}" data-tip="Elimina"><svg><use href="#icon-trash"/></svg></button>{% endif %}</li>
