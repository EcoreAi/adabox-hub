{% for c in risultati %}<form class="ds-cliente-voce" method="post" action="{% url 'discuss:lc_cliente_collega' canale_pk %}">{% csrf_token %}<input type="hidden" name="contatto" value="{{ c.pk }}"><span>{{ c.nome }}{% if c.email %} · {{ c.email }}{% endif %}</span><button type="submit" class="ui-btn ui-btn-secondary ui-btn-sm">Collega</button></form>{% empty %}{% if q|length >= 2 %}<div class="ds-cliente-voce">Nessun contatto trovato.</div>{% endif %}{% endfor %}
