<form class="ds-messaggio is-mio ds-modifica" id="m{{ m.pk }}" hx-post="{% url 'discuss:modifica' m.pk %}" hx-target="this" hx-swap="outerHTML">{% csrf_token %}
  <textarea class="ui-input" name="corpo" rows="3" aria-label="Testo del messaggio" required>{{ m.corpo }}</textarea>
  <div><button class="ui-btn ui-btn-primary ui-btn-sm" type="submit">Salva</button>
    <button class="ui-btn ui-btn-ghost ui-btn-sm" type="button" hx-get="{% url 'discuss:modifica' m.pk %}?annulla=1" hx-target="#m{{ m.pk }}" hx-swap="outerHTML">Annulla</button></div>
</form>
