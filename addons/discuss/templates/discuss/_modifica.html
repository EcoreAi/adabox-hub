<form class="ds-messaggio ds-modifica" id="m{{ m.pk }}" data-id="{{ m.pk }}" hx-post="{% url 'discuss:modifica' m.pk %}" hx-target="this" hx-swap="outerHTML">{% csrf_token %}
  <textarea class="ui-input" name="corpo" rows="3" aria-label="Modifica il messaggio" required>{{ m.corpo }}</textarea>
  <div class="ds-modifica-azioni"><button class="ui-btn ui-btn-primary ui-btn-sm" type="submit">Salva</button>
    <button class="ui-btn ui-btn-ghost ui-btn-sm" type="button" hx-get="{% url 'discuss:modifica' m.pk %}?annulla=1" hx-target="closest form" hx-swap="outerHTML">Annulla</button></div>
</form>
