{% load static discuss %}{% notifiche_non_lette request.user as n %}<a class="ds-campanella" id="ds-campanella" href="{% url 'discuss:posta' %}" title="Messaggi{% if n %}: {{ n }} non letti{% endif %}" aria-label="Messaggi{% if n %}, {{ n }} non letti{% endif %}"
   hx-get="{% url 'discuss:contatore' %}" hx-trigger="every 30s" hx-swap="outerHTML" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;color:inherit;margin-right:8px;">
  <svg style="width:18px;height:18px;"><use href="#icon-inbox"/></svg>{% if n %}<span style="position:absolute;top:2px;right:0;min-width:16px;padding:0 4px;border-radius:999px;background:var(--ui-primary);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;">{{ n }}</span>{% endif %}</a>
