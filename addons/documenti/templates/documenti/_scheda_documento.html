<section class="ui-card is-revealed ui-section">
  <div class="ui-card-head"><div class="ui-card-title">Anteprima</div></div>
  <div class="ui-card-body">
    {% if obj.immagine %}<img src="{% url 'documenti:scarica' obj.pk %}?inline=1" alt="{{ obj.nome }}" style="max-width:100%;max-height:480px;border-radius:8px;">
    {% elif obj.pdf %}<iframe src="{% url 'documenti:scarica' obj.pk %}?inline=1" title="{{ obj.nome }}" style="width:100%;height:560px;border:0;border-radius:8px;"></iframe>
    {% else %}<a class="ui-btn ui-btn-secondary" href="{% url 'documenti:scarica' obj.pk %}"><svg><use href="#icon-download"/></svg> Scarica {{ obj.nome }}</a>{% endif %}
  </div>
</section>
