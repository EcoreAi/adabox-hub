{% if obj.stato == "aperta" and request.user.pk == obj.destinatario_id %}
<section class="ui-card is-revealed ui-section">
  <div class="ui-card-head"><div class="ui-card-title">Carica il documento richiesto</div></div>
  <div class="ui-card-body">
    <form method="post" action="{% url 'documenti:evadi' obj.pk %}" enctype="multipart/form-data">{% csrf_token %}
      <input class="ui-input" type="file" name="file" required aria-label="File">
      <button class="ui-btn ui-btn-primary" type="submit" style="margin-top:8px">Carica e chiudi la richiesta</button>
    </form>
  </div>
</section>
{% elif obj.documento %}
<section class="ui-card is-revealed ui-section">
  <div class="ui-card-head"><div class="ui-card-title">Documento caricato</div></div>
  <div class="ui-card-body"><a class="ui-link" href="{% url 'documenti:documenti_dettaglio' obj.documento.pk %}">{{ obj.documento }}</a></div>
</section>
{% endif %}
